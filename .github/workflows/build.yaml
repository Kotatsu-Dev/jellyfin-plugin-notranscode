name: 'Build Plugin'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Jellyfin 12.0 targets net10.0. The jellyfin-meta-plugins reusable
      # workflows are pinned to older SDKs, so set the SDK up directly.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet publish -c Release --no-self-contained

      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.NoTranscode
          path: |
            Jellyfin.Plugin.NoTranscode/bin/Release/net10.0/publish/Jellyfin.Plugin.NoTranscode.dll
            Jellyfin.Plugin.NoTranscode/bin/Release/net10.0/publish/meta.json
          if-no-files-found: error
