<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <title>No Transcode</title>
</head>
<body>
<div id="NoTranscodeConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
        <div class="content-primary">
            <form id="NoTranscodeConfigForm">
                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="DisableVideoTranscoding" />
                        <span>Запретить перекодирование видео</span>
                    </label>
                    <div class="fieldDescription checkboxFieldDescription">
                        Основная нагрузка на CPU/GPU. Несовместимые файлы просто не запустятся.
                    </div>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="DisableAudioTranscoding" />
                        <span>Запретить перекодирование аудио</span>
                    </label>
                    <div class="fieldDescription checkboxFieldDescription">
                        Осторожно: дорожки AC3/DTS/TrueHD перестанут воспроизводиться в браузере.
                    </div>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="DisableRemuxing" />
                        <span>Запретить remux</span>
                    </label>
                    <div class="fieldDescription checkboxFieldDescription">
                        Remux меняет только контейнер и почти бесплатен — обычно оставляют разрешённым.
                    </div>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="ApplyOnStartup" />
                        <span>Применять ко всем при старте сервера</span>
                    </label>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="ApplyToNewUsers" />
                        <span>Применять к новым пользователям</span>
                    </label>
                </div>

                <div class="checkboxContainer checkboxContainer-withDescription">
                    <label class="emby-checkbox-label">
                        <input is="emby-checkbox" type="checkbox" id="SkipAdministrators" />
                        <span>Не трогать администраторов</span>
                    </label>
                </div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span>Сохранить</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script type="text/javascript">
        var NoTranscodeConfig = {
            pluginUniqueId: '8f4a2c1e-5b3d-4e7a-9c2f-1d6e8b0a3f57',
            fields: [
                'DisableVideoTranscoding',
                'DisableAudioTranscoding',
                'DisableRemuxing',
                'ApplyOnStartup',
                'ApplyToNewUsers',
                'SkipAdministrators'
            ]
        };

        document.querySelector('#NoTranscodeConfigPage')
            .addEventListener('pageshow', function () {
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(NoTranscodeConfig.pluginUniqueId).then(function (config) {
                    NoTranscodeConfig.fields.forEach(function (field) {
                        document.querySelector('#' + field).checked = config[field];
                    });
                    Dashboard.hideLoadingMsg();
                });
            });

        document.querySelector('#NoTranscodeConfigForm')
            .addEventListener('submit', function (e) {
                e.preventDefault();
                Dashboard.showLoadingMsg();
                ApiClient.getPluginConfiguration(NoTranscodeConfig.pluginUniqueId).then(function (config) {
                    NoTranscodeConfig.fields.forEach(function (field) {
                        config[field] = document.querySelector('#' + field).checked;
                    });
                    ApiClient.updatePluginConfiguration(NoTranscodeConfig.pluginUniqueId, config)
                        .then(Dashboard.processPluginConfigurationUpdateResult);
                });
                return false;
            });
    </script>
</div>
</body>
</html>
